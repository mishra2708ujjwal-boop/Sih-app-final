org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djdk.net.unixdomain.tmpdir=C:\\gradletmp -Djava.io.tmpdir=C:\\gradletmp
# Daemon disabled: the Gradle daemon failed with "a new daemon was started but
# could not be connected to" on this machine (loopback socket blocked / stale
# daemon). Building without it sidesteps the client<->daemon connection.
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
# Several plugins (tflite_flutter, flutter_secure_storage, ...) compile their
# Java with target 11 while their Kotlin defaults to 21. AGP 9 treats that
# per-module mismatch as a hard error. On Android the class files are all dexed
# by D8/R8, so the JVM-target gap has no runtime effect -- downgrade the check
# to a warning so the build proceeds.
kotlin.jvm.target.validation.mode=warning