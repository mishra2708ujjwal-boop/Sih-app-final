name: prana_health
description: "PRANA - Offline-First Edge-AI Personal Health Companion for Smart India Hackathon"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  flutter_blue_plus: ^1.34.0
  tflite_flutter: ^0.12.1
  drift: ^2.34.4
  path_provider: ^2.1.6
  path: ^1.9.1
  # Pure-Dart embedded database (no native module, like `pdf`) that backs the
  # on-device per-person ML pipeline: stores the individual's vitals feature
  # vectors and the learned personal-baseline model. Cannot touch the AGP/Gradle
  # build the way `sqlite3_flutter_libs` can.
  sembast: ^3.8.0
  # Pure-Dart PDF generation for the doctor-shareable Vitals report. Ships no
  # Android/Kotlin module (printing is a separate package we do not add), so it
  # cannot trigger the AGP/Gradle plugin-compile failures native plugins have.
  pdf: ^3.13.0
  flutter_secure_storage: ^11.0.0
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlcipher_flutter_libs: ^0.7.0+eol
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.24.9
  drift_dev: ^2.34.6
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/